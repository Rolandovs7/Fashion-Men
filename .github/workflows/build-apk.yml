name: Build APK

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true
      
      - name: Verify Flutter installation
        run: flutter doctor -v
      
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      
      - name: Disable R8 to avoid Stripe TapAndPay error
        working-directory: mobile
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle.kts
          echo "=== buildTypes después del sed ==="
          grep -A 6 "buildTypes" android/app/build.gradle.kts
      
      - name: Build Release APK
        working-directory: mobile
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: |
          # flutter build falla al no encontrar el APK por el buildDir redirigido
          # Usamos gradlew directamente y copiamos el APK
          flutter build apk --release || true
          
          # Buscar el APK generado (en cualquiera de las rutas posibles)
          APK_PATH=$(find . -name "app-release.apk" -path "*/outputs/*" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ No se encontró el APK. Compilando con gradlew..."
            cd android
            ./gradlew assembleRelease
            cd ..
            APK_PATH=$(find . -name "app-release.apk" -path "*/outputs/*" -type f 2>/dev/null | head -1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ El APK no se generó"
            exit 1
          fi
          
          echo "✅ APK encontrado en: $APK_PATH"
          ls -lh "$APK_PATH"
          
          # Copiar a la ruta esperada por Flutter
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menstyle-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: Build summary
        run: |
          echo "## ✅ APK compilado exitosamente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Descarga:** Ve a la sección **Artifacts** de este workflow" >> $GITHUB_STEP_SUMMARY
          echo "**Nombre del artifact:** menstyle-apk" >> $GITHUB_STEP_SUMMARY
