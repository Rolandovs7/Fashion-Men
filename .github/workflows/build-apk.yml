name: Build APK

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true
      
      - name: Verify Flutter installation
        run: flutter doctor -v
      
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      
      - name: Disable R8 to avoid Stripe TapAndPay error
        working-directory: mobile
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle.kts
          echo "=== buildTypes después del sed ==="
          grep -A 6 "buildTypes" android/app/build.gradle.kts
      
      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menstyle-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: Build summary
        run: |
          echo "## ✅ APK compilado exitosamente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Descarga:** Ve a la sección **Artifacts** de este workflow" >> $GITHUB_STEP_SUMMARY
          echo "**Nombre del artifact:** menstyle-apk" >> $GITHUB_STEP_SUMMARY
