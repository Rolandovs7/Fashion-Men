<app-admin-shell titulo="Checkout de Suscripción">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <app-alert *ngIf="error" tipo="error" [mensaje]="error"></app-alert>

    <div *ngIf="planId" class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="bg-gradient-to-r from-gray-900 to-gray-700 text-white p-6">
        <p class="text-xs uppercase tracking-widest text-gray-300">Resumen de pago</p>
        <h2 class="text-2xl font-bold mt-1">Plan {{ planNombre }}</h2>
        <p class="text-3xl font-extrabold mt-2">${{ monto }}<span class="text-base font-medium text-gray-300">/mes</span></p>
      </div>

      <form (ngSubmit)="pagar()" class="p-6 space-y-4">
        <h3 class="font-bold text-gray-900">Datos de tarjeta (simulado)</h3>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Titular</label>
          <input [(ngModel)]="titular" name="titular" placeholder="Nombre en la tarjeta" class="w-full border border-gray-300 rounded-xl px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Número de tarjeta</label>
          <input [(ngModel)]="tarjeta" name="tarjeta" placeholder="4242 4242 4242 4242" maxlength="19" class="w-full border border-gray-300 rounded-xl px-3 py-2" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha (MM/AA)</label>
            <input [(ngModel)]="fecha" name="fecha" placeholder="12/28" maxlength="5" class="w-full border border-gray-300 rounded-xl px-3 py-2" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">CVC</label>
            <input [(ngModel)]="cvc" name="cvc" placeholder="123" maxlength="4" class="w-full border border-gray-300 rounded-xl px-3 py-2" />
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" (click)="cancelar()" class="flex-1 py-2.5 px-4 rounded-xl font-semibold border border-gray-300 text-gray-700 hover:bg-gray-50">Cancelar</button>
          <button type="submit" [disabled]="procesando" class="flex-1 py-2.5 px-4 rounded-xl font-semibold bg-gray-900 text-white hover:bg-gray-800 disabled:opacity-60">
            {{ procesando ? 'Procesando pago...' : 'Pagar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</app-admin-shell>
