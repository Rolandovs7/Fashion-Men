<div class="min-h-screen bg-neutral-950 relative overflow-hidden flex items-center justify-center px-4 py-8 sm:px-6 lg:px-8">

  <!-- ═══════════════════════════════════════════════ -->
  <!-- FONDO DECORATIVO CON BLOBS                      -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="absolute inset-0 pointer-events-none">
    <!-- Blob ámbar arriba izquierda -->
    <div class="absolute -top-32 -left-32 w-[500px] h-[500px] bg-amber-400/20 rounded-full blur-3xl"></div>
    <!-- Blob ámbar abajo derecha -->
    <div class="absolute -bottom-32 -right-32 w-[500px] h-[500px] bg-amber-300/15 rounded-full blur-3xl"></div>
    <!-- Blob gris en medio -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-neutral-800/30 rounded-full blur-3xl"></div>
    <!-- Grid pattern sutil -->
    <div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(white 1px, transparent 1px), linear-gradient(90deg, white 1px, transparent 1px); background-size: 40px 40px;"></div>
  </div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CONTENIDO PRINCIPAL                             -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="relative z-10 w-full max-w-md space-y-6">

    <!-- Marca / Branding -->
    <div class="text-center">
      <!-- Logo M en SVG -->
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-2xl mb-5">
        <svg viewBox="0 0 40 40" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" fill="white" rx="10"/>
          <text x="20" y="29"
                text-anchor="middle"
                font-family="Arial Black, Arial, Helvetica, sans-serif"
                font-weight="900"
                font-size="26"
                fill="#0a0a0a"
                letter-spacing="-1.5">M</text>
        </svg>
      </div>

      <h1 class="text-3xl sm:text-4xl font-black tracking-[0.25em] text-white uppercase mb-2">
        MENSTYLE
      </h1>
      <p class="text-neutral-400 text-xs sm:text-sm font-medium tracking-wide">
        Plataforma Inteligente de Comercio Electrónico
      </p>
    </div>

    <!-- Tarjeta Principal (más compacta) -->
    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 p-6 sm:p-8">

      <div class="mb-6 text-center">
        <h2 class="text-xl sm:text-2xl font-bold text-neutral-900 tracking-tight">
          Iniciar sesión
        </h2>
        <p class="mt-1.5 text-xs sm:text-sm text-neutral-500">
          Ingresá tus credenciales para acceder
        </p>
      </div>

      <!-- Alerta de Error -->
      @if (error) {
        <div class="mb-5 rounded-xl border border-red-200 bg-red-50/90 p-3.5 text-sm text-red-700 flex items-start gap-3">
          <svg class="w-5 h-5 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="font-medium">{{ error }}</span>
        </div>
      }

      <!-- Formulario -->
      <form (ngSubmit)="iniciarSesion()" class="space-y-5">

        <!-- Campo Email -->
        <div>
          <label for="email" class="mb-1.5 block text-xs font-bold text-neutral-700 uppercase tracking-wider">
            Correo electrónico
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              class="w-full rounded-xl border border-neutral-300 bg-neutral-50/50 pl-11 pr-4 py-3 text-sm text-neutral-900 outline-none transition-all duration-200 placeholder:text-neutral-400 focus:bg-white focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
            />
          </div>
        </div>

        <!-- Campo Contraseña con ojito -->
        <div>
          <label for="password" class="mb-1.5 block text-xs font-bold text-neutral-700 uppercase tracking-wider">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input
              id="password"
              [type]="mostrarPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full rounded-xl border border-neutral-300 bg-neutral-50/50 pl-11 pr-12 py-3 text-sm text-neutral-900 outline-none transition-all duration-200 placeholder:text-neutral-400 focus:bg-white focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
            />
            <!-- Botón ojito -->
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-400 hover:text-neutral-700 transition-colors cursor-pointer"
              [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              @if (mostrarPassword) {
                <!-- Ojito abierto (contraseña visible) -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              } @else {
                <!-- Ojito cerrado (contraseña oculta) -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Link ¿Olvidaste tu contraseña? -->
        <div class="text-right">
          <a
            routerLink="/forgot-password"
            class="text-xs font-semibold text-neutral-500 hover:text-neutral-900 transition-colors cursor-pointer">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón de Submit -->
        <button
          type="submit"
          [disabled]="cargando"
          class="w-full flex justify-center items-center rounded-xl bg-neutral-950 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-neutral-950/20 transition-all duration-200 hover:bg-neutral-800 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:bg-neutral-950 cursor-pointer">

          @if (cargando) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Iniciando sesión...
          } @else {
            Iniciar sesión
          }

        </button>

      </form>

      <!-- Enlace a Registro -->
      <div class="mt-6 border-t border-neutral-200/60 pt-5 text-center">
        <p class="text-sm text-neutral-600">
          ¿No tenés una cuenta?
          <a
            routerLink="/registro"
            class="font-bold text-neutral-950 hover:underline transition-all ml-1">
            Crear cuenta
          </a>
        </p>
      </div>

    </div>

    <!-- Footer -->
    <div class="text-center space-y-1">
      <p class="text-xs font-medium text-neutral-500">
        © 2026 MenStyle • FashionStore
      </p>
      <p class="text-[11px] text-neutral-600">
        Sistemas II - UAGRM
      </p>
    </div>

  </div>

</div>
