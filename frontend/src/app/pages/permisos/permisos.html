<app-admin-shell titulo="Gestión de Permisos">

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full bg-ms-alabaster">

    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-xs font-medium text-ms-slate mb-8">
      <span>Administración</span>
      <span class="text-ms-outline">/</span>
      <span class="text-ms-ink">Permisos</span>
    </nav>

    <!-- Encabezado -->
    <div class="mb-8">
      <p class="text-[11px] uppercase tracking-[0.25em] text-ms-amber font-bold">Permisos</p>
      <h1 class="mt-2 font-display text-4xl lg:text-5xl tracking-[-0.02em] text-ms-ink">Gestión de Permisos</h1>
      <p class="mt-2 text-sm text-ms-slate">Asigna los permisos según el rol del usuario.</p>
    </div>

    <!-- Mensajes -->
    @if (mensaje) {
      <div class="mb-6 animate-fade-in">
        <app-alert tipo="exito" [mensaje]="mensaje" [dismissible]="true" (cerrar)="mensaje = ''"></app-alert>
      </div>
    }
    @if (error) {
      <div class="mb-6 animate-fade-in">
        <app-alert tipo="error" [mensaje]="error" [dismissible]="true" (cerrar)="error = ''"></app-alert>
      </div>
    }

    <!-- Card principal -->
    <div class="bg-ms-white rounded-2xl border border-ms-stone-200 shadow-card p-6 sm:p-8">

      <div class="mb-8">
        <app-select
          label="Rol"
          placeholder="Selecciona un rol"
          [opciones]="opcionesRoles"
          [ngModel]="rolSeleccionado"
          (ngModelChange)="onRolCambiado($event)" />
      </div>

      @if (cargando) {
        <div class="py-16">
          <app-loader size="md" texto="Cargando permisos..." [centrado]="true"></app-loader>
        </div>
      } @else {

        <h2 class="font-display uppercase tracking-[0.15em] text-ms-ink text-sm mb-4">Permisos disponibles</h2>

        <div class="space-y-2 mb-8">
          @for (permiso of permisos; track permiso.id) {
            <label
              class="flex items-start gap-3 rounded-xl border border-ms-stone-200 bg-ms-stone/30 p-4 cursor-pointer transition-all hover:border-ms-stone-200 hover:bg-ms-stone/60"
              [class.border-ms-amber/40]="tienePermiso(permiso.id)"
              [class.bg-ms-cream/30]="tienePermiso(permiso.id)"
              [class.ring-1]="tienePermiso(permiso.id)"
              [class.ring-ms-amber/30]="tienePermiso(permiso.id)">
              <input
                type="checkbox"
                [checked]="tienePermiso(permiso.id)"
                (change)="cambiarPermiso(permiso.id)"
                class="mt-0.5 w-4 h-4 rounded border-ms-stone-200 text-ms-amber focus:ring-ms-amber cursor-pointer"
              />
              <div>
                <p class="font-semibold text-ms-ink text-sm">{{ permiso.descripcion }}</p>
                <p class="text-xs text-ms-slate font-medium mt-0.5">{{ permiso.nombre }}</p>
              </div>
            </label>
          } @empty {
            <app-empty-state
              icono="🔒"
              titulo="No hay permisos registrados"
              descripcion="No se encontraron permisos para mostrar." />
          }
        </div>

        <div class="w-full sm:w-auto">
          <app-button variant="primario" [block]="true" [loading]="guardando" (click)="guardar()">
            Guardar permisos
          </app-button>
        </div>

      }

    </div>

  </div>

</app-admin-shell>
