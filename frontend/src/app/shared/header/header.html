<header class="bg-neutral-950 text-white sticky top-0 z-50 border-b border-neutral-800 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between w-full gap-4">

    <!-- Marca -->
    <a routerLink="/catalogo" class="flex items-center gap-3 shrink-0">
      <div class="w-10 h-10 bg-white text-neutral-950 rounded-xl flex items-center justify-center font-black text-xl shadow-md">
        M
      </div>
      <div class="hidden sm:block">
        <h1 class="text-xl sm:text-2xl font-black tracking-[0.2em] text-white uppercase leading-none">
          MENSTYLE
        </h1>
        <span class="text-[10px] text-neutral-400 font-semibold tracking-widest uppercase block mt-1">
          FashionStore Platform
        </span>
      </div>
    </a>

    <!-- Navegación -->
    <nav class="flex items-center gap-1 sm:gap-2 flex-1 justify-center">
      <a routerLink="/inicio" routerLinkActive="bg-neutral-800 text-white" [routerLinkActiveOptions]="{exact: true}"
        class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-neutral-300 hover:bg-neutral-900 hover:text-white transition-all">
        Inicio
      </a>
      <a routerLink="/catalogo" routerLinkActive="bg-neutral-800 text-white"
        class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-neutral-300 hover:bg-neutral-900 hover:text-white transition-all">
        Catálogo
      </a>
      <a routerLink="/pedidos" routerLinkActive="bg-neutral-800 text-white"
        class="hidden sm:inline px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-neutral-300 hover:bg-neutral-900 hover:text-white transition-all">
        Mis Pedidos
      </a>
      <a routerLink="/reservas" routerLinkActive="bg-neutral-800 text-white"
        class="hidden sm:inline px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-neutral-300 hover:bg-neutral-900 hover:text-white transition-all">
        Mis Reservas
      </a>

      @if (esAdministrador()) {
        <a routerLink="/admin/catalogo" routerLinkActive="bg-neutral-800 text-white"
          class="hidden md:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-amber-300 hover:bg-neutral-900 hover:text-amber-200 transition-all">
          <span>⚙️</span>
          <span>Panel de Administración</span>
        </a>
      }
    </nav>

    <!-- Derecha: Carrito + Sesión -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <a routerLink="/carrito" class="relative inline-flex items-center justify-center w-10 h-10 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 transition-all">
        <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        @if ((totalCarrito$ | async); as total) {
          @if (total > 0) {
            <span class="absolute -top-1.5 -right-1.5 bg-amber-400 text-neutral-950 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">
              {{ total }}
            </span>
          }
        }
      </a>

      <button
        (click)="cerrarSesion()"
        class="inline-flex items-center gap-2 bg-neutral-900 hover:bg-neutral-800 text-white border border-neutral-700 hover:border-neutral-600 active:scale-95 font-semibold text-xs sm:text-sm px-3 sm:px-4 py-2.5 rounded-xl transition-all duration-200 shadow-sm cursor-pointer">
        <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="hidden sm:inline">Salir</span>
      </button>
    </div>

  </div>
</header>
