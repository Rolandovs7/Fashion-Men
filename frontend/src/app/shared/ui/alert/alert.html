<div
  [class]="clasesContenedor"
  class="rounded-xl border p-4 text-sm font-medium shadow-sm animate-fade-in">

  <div class="flex items-start gap-3">
    <div class="shrink-0 mt-0.5">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="trayectoIcono"/>
      </svg>
    </div>

    <div class="flex-1 min-w-0">
      @if (titulo) {
        <p class="font-bold mb-0.5">{{ titulo }}</p>
      }
      @if (mensaje) {
        <p [class.text-sm]="!!titulo">{{ mensaje }}</p>
      }
      <ng-content></ng-content>
    </div>

    @if (dismissible) {
      <button
        type="button"
        (click)="cerrar.emit()"
        class="shrink-0 w-7 h-7 rounded-lg flex items-center justify-center hover:bg-black/5 transition-colors cursor-pointer"
        title="Cerrar aviso">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    }
  </div>
</div>
