<button
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading"
  [class]="clasesBoton"
  [class.w-full]="block"
  class="relative inline-flex items-center justify-center rounded-xl font-bold transition-all active:scale-[0.98] select-none whitespace-nowrap cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-950 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">

  <span [class.invisible]="loading" class="inline-flex items-center justify-center gap-2">
    <ng-content></ng-content>
  </span>

  @if (loading) {
    <span class="absolute inset-0 flex items-center justify-center">
      <app-loader size="sm" [claro]="cargadorClaro" />
    </span>
  }
</button>
