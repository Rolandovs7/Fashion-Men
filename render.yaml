# ============================================================
# Render Blueprint - MenStyle
# ============================================================
services:
  # Backend API
  - type: web
    name: menstyle-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menstyle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0

  # Frontend Web (Static Site)
  - type: web
    name: menstyle-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: menstyle-db
    plan: free
    databaseName: menstyle_db
    user: menstyle_user
